name: Release Android TV y Mobile

# Un solo tag `vX.Y.Z` dispara la compilación de las dos apps y publica DOS
# releases independientes:
#
#   vX.Y.Z-tv      -> jkanime-tv-X.Y.Z.apk      (solo Android TV)
#   vX.Y.Z-mobile  -> jkanime-mobile-X.Y.Z.apk  (solo teléfono)
#
# Así, al abrir la página de releases desde un celular solo se ofrece la APK
# de móvil, y desde un televisor solo la de TV. Un release único con dos
# assets confundía: se descargaba e instalaba la APK de TV en el teléfono (app
# Leanback, sin táctil), que es exactamente el "se traba y se sale" reportado.

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Los tags que este mismo job crea (vX.Y.Z-tv / vX.Y.Z-mobile) no deben
    # relanzar el pipeline.
    if: >-
      ${{ !endsWith(github.ref_name, '-tv') &&
          !endsWith(github.ref_name, '-mobile') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: versionCode = 100 + nº de commits necesita
          # el conteo real (con fetch-depth 1 siempre daría 101).
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Preparar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jkanimetv-release.keystore"

      - name: Construir APKs firmados (TV + Mobile)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jkanimetv-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JK_SUPABASE_URL: ${{ vars.JK_SUPABASE_URL }}
          JK_SUPABASE_ANON_KEY: ${{ secrets.JK_SUPABASE_ANON_KEY }}
        run: |
          test -n "$JK_SUPABASE_URL" || {
            echo "Falta el secreto JK_SUPABASE_URL"
            exit 1
          }
          test -n "$JK_SUPABASE_ANON_KEY" || {
            echo "Falta el secreto JK_SUPABASE_ANON_KEY"
            exit 1
          }
          VERSION_NAME="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' gradle.properties | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION_NAME" = "$TAG_VERSION" || {
            echo "El tag $TAG_VERSION no coincide con VERSION_NAME=$VERSION_NAME en gradle.properties"
            exit 1
          }
          # versionCode = 100 + nº de commits: siempre crece con el repo y
          # supera a los builds locales de sideload (GITHUB_RUN_NUMBER se
          # reinicia por repo y podía quedar por debajo de una release ya publicada).
          VERSION_CODE=$((100 + $(git rev-list --count HEAD)))
          echo "Versión: $VERSION_NAME (code $VERSION_CODE)"

          # Android TV
          ./gradlew :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PJK_SUPABASE_URL="$JK_SUPABASE_URL" \
            -PJK_SUPABASE_ANON_KEY="$JK_SUPABASE_ANON_KEY"

          # Android móvil (módulo distinto: :app-mobile)
          ./gradlew :app-mobile:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PJK_SUPABASE_URL="$JK_SUPABASE_URL" \
            -PJK_SUPABASE_ANON_KEY="$JK_SUPABASE_ANON_KEY"

          # AGP nombra los artefactos con el nombre del módulo, así que el APK
          # móvil NO es `app-release.apk`. Se localizan con `find` y se copian
          # a nombres estables para el release.
          TV_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          MOBILE_APK="$(find app-mobile/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$TV_APK" || TV_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$MOBILE_APK" || MOBILE_APK="$(find app-mobile/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$TV_APK" && test -n "$MOBILE_APK"
          cp "$TV_APK" "jkanime-tv-${VERSION_NAME}.apk"
          cp "$MOBILE_APK" "jkanime-mobile-${VERSION_NAME}.apk"

      - name: Verificar que cada APK es del dispositivo correcto
        run: |
          VERSION_NAME="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' gradle.properties | tr -d '[:space:]')"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in "jkanime-tv-${VERSION_NAME}.apk" "jkanime-mobile-${VERSION_NAME}.apk"; do
            echo "== $apk =="
            "$BUILD_TOOLS/aapt2" dump badging "$apk" | grep -E "^package:|launchable-activity:|uses-feature:.*leanback|uses-feature:.*touchscreen" || true
          done
          # Salvaguarda: el APK de TV debe declarar Leanback y el de móvil no.
          "$BUILD_TOOLS/aapt2" dump badging "jkanime-tv-${VERSION_NAME}.apk" | grep -q "leanback" || {
            echo "El APK de TV no declara Leanback"
            exit 1
          }
          if "$BUILD_TOOLS/aapt2" dump badging "jkanime-mobile-${VERSION_NAME}.apk" | grep -q "leanback"; then
            echo "El APK móvil declara Leanback: se publicaría la app equivocada"
            exit 1
          fi

      - name: Publicar release de Android TV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' gradle.properties | tr -d '[:space:]')"
          printf '%s\n' \
            'APK para **Android TV / Google TV** (Leanback, mando a distancia).' \
            '' \
            "Instalar con \`adb install jkanime-tv-${VERSION_NAME}.apk\` o por sideload en el televisor." \
            '' \
            'Comparte la misma cuenta de sincronización que la app móvil: vincula el código de 8 dígitos desde el menú de perfil.' \
            > /tmp/notes-tv.md
          gh release create "v${VERSION_NAME}-tv" \
            "jkanime-tv-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "jkanime TV ${VERSION_NAME}" \
            --notes-file /tmp/notes-tv.md

      - name: Publicar release de Android móvil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' gradle.properties | tr -d '[:space:]')"
          printf '%s\n' \
            'APK para **teléfono y tablet Android** (táctil, vertical).' \
            '' \
            "Instalar abriendo el archivo en el dispositivo (permitir orígenes desconocidos) o con \`adb install jkanime-mobile-${VERSION_NAME}.apk\`." \
            '' \
            'Comparte la misma cuenta de sincronización que la app de TV: vincula el código de 8 dígitos desde el menú → Sincronización.' \
            > /tmp/notes-mobile.md
          gh release create "v${VERSION_NAME}-mobile" \
            "jkanime-mobile-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "jkanime Mobile ${VERSION_NAME}" \
            --notes-file /tmp/notes-mobile.md
