name: Release Android TV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jkanimetv-release.keystore"

      - name: Construir APK firmado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jkanimetv-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$GITHUB_RUN_NUMBER"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "jkanimetv $GITHUB_REF_NAME" \
            --generate-notes
