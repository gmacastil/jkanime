name: Release Android TV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: versionCode = 100 + nº de commits necesita
          # el conteo real (con fetch-depth 1 siempre daría 101).
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Preparar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jkanimetv-release.keystore"

      - name: Construir APK firmado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jkanimetv-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JK_SUPABASE_URL: ${{ secrets.JK_SUPABASE_URL }}
          JK_SUPABASE_ANON_KEY: ${{ secrets.JK_SUPABASE_ANON_KEY }}
        run: |
          test -n "$JK_SUPABASE_URL" || {
            echo "Falta el secreto JK_SUPABASE_URL"
            exit 1
          }
          test -n "$JK_SUPABASE_ANON_KEY" || {
            echo "Falta el secreto JK_SUPABASE_ANON_KEY"
            exit 1
          }
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # versionCode = 100 + nº de commits: siempre crece con el repo y
          # supera a los builds locales de sideload (GITHUB_RUN_NUMBER se
          # reinicia por repo y podía quedar por debajo de una TV ya actualizada).
          VERSION_CODE=$((100 + $(git rev-list --count HEAD)))
          ./gradlew :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PJK_SUPABASE_URL="$JK_SUPABASE_URL" \
            -PJK_SUPABASE_ANON_KEY="$JK_SUPABASE_ANON_KEY"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "jkanimetv $GITHUB_REF_NAME" \
            --generate-notes
